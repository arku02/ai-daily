# 讀者背景範例：AI 用它來選題與撰寫「你可以怎麼用」。
# 複製成 profile.toml 改成你自己的背景；profile.toml 不會被上傳（已在 .gitignore）。
# 沒有 profile.toml 時才會使用這個範例。

background = "開發 AI 應用的工程師，想找能實際拿來用的工具與專案。"
stack = ["Python", "可用的 LLM API：（填你有的，例如某家的免費方案或本機模型）"]
work = ["（填你的工作內容，例如：資料處理、自動化、後端服務）"]
interests = [
  "AI Agent",
  "RAG 與知識庫",
  "開源模型",
]
exclude_topics = ["融資、募資、估值新聞", "公司人事異動"]

# 「今天試一個」的挑選規則
try_one_rules = [
  "15～30 分鐘內能看到結果（pip install 或改一個設定就能試）",
  "免費、開源或有免費額度",
  "和讀者的工作有關",
  "當天沒有符合的就回傳 null，不要硬湊",
]
