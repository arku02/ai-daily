# 每天台北 08:45 開始：抓取 → 撰寫 → 網頁上線 → 推送 Telegram
name: daily

on:
  schedule:
    - cron: "45 0 * * *"   # UTC 00:45 = 台北 08:45；GitHub 排程可能延遲
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-daily
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Write private profile
        env:
          PROFILE_TOML: ${{ secrets.PROFILE_TOML }}
        run: printf '%s\n' "$PROFILE_TOML" > profile.toml

      - name: Fetch
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m ai_daily fetch

      - name: Digest
        id: digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ai_daily digest

      - name: Render
        if: steps.digest.outcome == 'success'
        run: python -m ai_daily render

      - name: Commit data
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Taipei date +%F) 早報資料"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v6
        if: steps.digest.outcome == 'success'
      - uses: actions/upload-pages-artifact@v5
        if: steps.digest.outcome == 'success'
        with:
          path: site

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ 早報 daily（build）失敗：${RUN_URL}" > /dev/null

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ 早報 daily（deploy）失敗：${RUN_URL}" > /dev/null

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # 取 build 提交後的最新 data/digest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Push to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m ai_daily push

      - name: Commit push record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/push
          if git diff --cached --quiet; then echo "沒有新推送紀錄"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Taipei date +%F) 推送紀錄"
          git pull --rebase
          git push

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ 早報 daily（notify）失敗：${RUN_URL}" > /dev/null
