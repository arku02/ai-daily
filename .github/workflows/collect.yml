# 每 6 小時收一次 Telegram 與網頁（Cloudflare Worker）回饋，存進私人 repo ai-daily-feedback
name: collect

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-daily
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: arku02/ai-daily-feedback
          token: ${{ secrets.FEEDBACK_REPO_TOKEN }}
          path: feedback-repo
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEEDBACK_READ_KEY: ${{ secrets.FEEDBACK_READ_KEY }}
          FEEDBACK_DIR: feedback-repo
        run: python -m ai_daily collect

      - name: Commit feedback
        working-directory: feedback-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "沒有新回饋"; exit 0; fi
          git commit -m "feedback: $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase
          git push

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ 早報 collect 失敗：${RUN_URL}" > /dev/null
